[project]
name = "ml-specialization-course-2"
version = "0.1.0"
description = "Isolated environment for the original Course 2 notebooks"
requires-python = "==3.11.*"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.10.1",
    "scikit-learn==1.1.3",
    "matplotlib==3.7.5",
    "pillow==10.4.0",
    "ipympl==0.9.8",
    "ipywidgets==8.1.8",
    "ipykernel==6.30.1",
    "ipython==8.37.0",
    "matplotlib-inline==0.1.7",
    "jupyterlab==4.4.10",
    "pip==25.2",
    # TensorFlow's Windows runtime has different dependency metadata from Linux wheels.
    "tensorflow-intel==2.15.1; sys_platform == 'win32'",
    "tensorflow==2.15.1; sys_platform != 'win32'",
    "pandas==1.5.3",
    "networkx==3.2.1",
    "xgboost==2.0.3",
]

[tool.uv]
package = false
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
